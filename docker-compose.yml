version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: runner_postgres
    restart: always
    environment:
      POSTGRES_DB: runner_db
      POSTGRES_USER: runner_user
      POSTGRES_PASSWORD: runner_password
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 최초 생성 시 산출물 v2.0 DDL 스크립트를 자동 실행하여 테이블 & 초기 데이터 세팅
      - ./산출물/PostgreSQL_DDL_Running_Coach_v2.0.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runner_user -d runner_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: runner_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/runner_db
      SPRING_DATASOURCE_USERNAME: runner_user
      SPRING_DATASOURCE_PASSWORD: runner_password
      # 배포 시 변경하고 싶다면 아래 값을 실서버 주소로 변경
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_OAUTH2_REDIRECT_URI: http://localhost:5173/oauth2/callback
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
        
  stat_service:
    build:
      context: ./stat_service
      dockerfile: Dockerfile
    container_name: runner_stat_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: runner_db
      POSTGRES_USER: runner_user
      POSTGRES_PASSWORD: runner_password
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    env_file:
      - ./stat_service/.env
    volumes:
      #가민 로그인 세션 토큰 디렉토리를 로컬과 마운트하여 컨테이너 재시작 후에도 유지
      - ./stat_service/app/garmin/tokens:/app/app/garmin/tokens
    depends_on:
      postgres:
        condition: service_healthy
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: runner_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_SPRING_API_URL: http://localhost:8080/api
      VITE_STAT_SERVICE_URL: http://localhost:8000
    depends_on:
      - backend
      - stat_service
volumes:
  postgres_data: