server:
  port: 8080

spring:
  application:
    name: running-coach-core
  profiles:
    include: secret, weather

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/runner_db
    username: runner_user
    password: runner_password
  #OAuth2 로그인 클라이언트 설정
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

          #Naver 추가
          naver:
            client-id: ${NAVER_CLIENT_ID:YOUR_NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET:YOUR_NAVER_CLIENT_SECRET}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
              - profile_image
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

mybatis:
  type-aliases-package: com.runner.core.**.domain
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # 256비트 이상의 Base64 비밀키
  secret: c3VwZXItc2VjcmV0LWtleS1mb3ItcnVubmluZy1jb2FjaC1qd3QtdG9rZW4tZ2VuZXJhdGlvbi0yNTYtYml0cw==
  access-token-expiration: 1800000      # Access Token 만료시간: 30분 (1,800,000 ms)
  refresh-token-expiration: 1209600000  # Refresh Token 만료시간: 14일 (1,209,600,000 ms)

app:
  oauth2:
    # 소셜 로그인 성공 후 리다이렉트할 프론트엔드/콜백 URL
    redirect-uri: http://localhost:5173/oauth2/callback